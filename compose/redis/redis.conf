# =============================================================================
# redis.conf — cache and queue backend (M4)
# =============================================================================
#
# WHY REDIS IS HERE AT ALL
#   n8n's queue execution mode needs it (M6), and later services want a cache
#   and a rate-limit store. One shared instance, same reasoning as one shared
#   Postgres (ADR-0005): three containers on a 3.7 GB host is not worth the
#   isolation when the network already prevents anything outside `net-data`
#   from reaching it (ADR-0004).
#
# HOW THIS FILE IS LOADED
#   Mounted read-only; the container's command is `redis-server <this file>`.
#   The password is NOT in here — it is injected at startup from .env, because
#   this file is committed to Git and secrets are not (ADR-0006).
#
# THE ISOLATION CAVEAT
#   Redis has no per-database access control. `SELECT n` gives logical
#   separation, not security: any service holding the password can read every
#   database. Unlike Postgres, isolation here is by network membership only.
#   Anything genuinely needing to be unreadable by another service belongs in
#   Postgres, not Redis.
# =============================================================================

# ── Network ─────────────────────────────────────────────────────────────────
# Bind to all interfaces *inside the container*. Safe because the container is
# only on `net-data`, which is `internal: true` — no host port, no route out.
bind 0.0.0.0
port 6379

# Belt and braces on top of network segmentation: even when reachable, an
# unauthenticated client is refused.
protected-mode yes

# Drop idle clients after 5 minutes. A service that leaks connections then
# leaks them at a bounded rate rather than forever.
timeout 300

# Detect dead peers. Without this, a client killed mid-connection leaves a
# backend pinned until the OS eventually reaps the socket.
tcp-keepalive 300

# ── Memory ──────────────────────────────────────────────────────────────────
# Hard ceiling. Redis is allotted ~256 MB of the 3.7 GB host. Without a
# maxmemory, Redis grows until the OOM killer intervenes, and it will not
# necessarily be Redis that gets killed.
maxmemory 256mb

# THE IMPORTANT LINE. `allkeys-lru` would silently evict queue jobs under
# pressure, losing work. `noeviction` instead makes writes fail loudly once
# full, so the symptom is an error in the client rather than vanished data.
#
# If a pure cache is added later that genuinely wants eviction, it belongs in
# a second instance with its own policy — not a change to this one.
maxmemory-policy noeviction

# ── Persistence ─────────────────────────────────────────────────────────────
# Redis holds queue state that should survive a container restart, so it is not
# treated as a pure cache. Both mechanisms are on:
#
#   RDB : periodic point-in-time snapshot. Cheap, coarse.
#   AOF : append-only log of writes. Finer-grained, bounded loss.
#
# save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

# Stop accepting writes if snapshots are failing. The alternative is a silent
# divergence between what Redis holds and what is on disk.
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"

# fsync once per second: at most one second of writes lost on a hard kill,
# versus `always` (safe, materially slower) or `no` (fast, unbounded loss).
appendfsync everysec

# Rewrite the log when it doubles, so it cannot grow without limit.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Logging ─────────────────────────────────────────────────────────────────
# Empty logfile = stdout, so `docker compose logs redis` is the one place to
# look and Docker handles rotation.
logfile ""
loglevel notice

# ── Safety ──────────────────────────────────────────────────────────────────
# Commands that are one typo away from destroying the instance. FLUSHALL and
# FLUSHDB wipe data; CONFIG lets a client rewrite these settings at runtime,
# which would defeat everything above.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# Keyspace notifications, off by default. Some queue libraries want "Ex"
# (expired-key events); enable deliberately when a service actually needs it.
notify-keyspace-events ""

# ── Databases ───────────────────────────────────────────────────────────────
# Logical separation only — see THE ISOLATION CAVEAT above. Assignment is
# recorded here so two services cannot silently claim the same number:
#   0  n8n queue (M6)
#   1  paperclip cache (M9)
#   2  hermes cache (M9)
databases 16
