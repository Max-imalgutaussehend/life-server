# =============================================================================
# docker-compose.prod.yml — the production stack.
# =============================================================================
#
# WHY THIS FILE LOOKS THE WAY IT DOES
#   - No `ports:` on anything web-facing. Traffic arrives through the
#     Cloudflare tunnel, which dials OUT. Publishing a port would reopen the
#     public attack surface the tunnel exists to remove. (ADR-0003)
#   - Every named object carries ${ENV_PREFIX_NAME} so a dev stack can run
#     alongside prod without colliding. (ADR-0010)
#   - Image tags are pinned to an explicit minor version, never :latest.
#     Pre-commit rejects :latest. (ADR-0011)
#   - Services join only the networks they need. (ADR-0004)
#
# USAGE (on the server, as deploy)
#   cd /opt/life-server && docker compose up -d
#   Locally: make status / make logs / make health
# =============================================================================

name: ${ENV_PREFIX_NAME:-prod-}life-server

# ── Networks (ADR-0004) ─────────────────────────────────────────────────────
# edge  : tunnel <-> proxy only
# apps  : proxy <-> applications
# data  : applications <-> databases. `internal: true` means NO route to the
#         internet at all — a database container cannot phone home.
networks:
  edge:
    name: ${ENV_PREFIX_NAME:-prod-}net-edge
  apps:
    name: ${ENV_PREFIX_NAME:-prod-}net-apps
  data:
    name: ${ENV_PREFIX_NAME:-prod-}net-data
    internal: true
services:

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────
  # Outbound-only. Holds a persistent connection to Cloudflare's edge and
  # forwards inbound requests to Caddy. Never listens on a host port.
  # NOTE ON TOKEN MODE (dashboard-managed):
  #   A token-run tunnel takes its ingress rules from the Cloudflare dashboard
  #   and IGNORES any local config.yml. That splits the source of truth, which
  #   ADR-0014 exists to prevent — so the dashboard is kept deliberately empty
  #   with a single wildcard rule pointing at Caddy, and Caddy (driven by
  #   services.yml) does all real routing. One dashboard rule, set once, never
  #   touched again as services are added.
  #
  #   Migrating to a locally-managed tunnel (credentials file + config.yml) is
  #   the cleaner end state and is tracked for M7, when SOPS makes storing the
  #   credentials file safe.
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    container_name: ${ENV_PREFIX_NAME:-prod-}cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is not set in .env}
      TUNNEL_METRICS: 0.0.0.0:2000
    networks:
      - edge
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      caddy:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── Caddy ─────────────────────────────────────────────────────────────────
  # Reverse proxy. Deliberately NOT the TLS terminator (Cloudflare is), and
  # deliberately not publishing 80/443. Kept because it owns routing and is
  # the seam that makes future Tailscale/LAN ingress a config change rather
  # than a rebuild.
  caddy:
    image: caddy:2.10.2-alpine
    container_name: ${ENV_PREFIX_NAME:-prod-}caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env}
      ENV_PREFIX: ${ENV_PREFIX-}
      ENV_PREFIX_NAME: ${ENV_PREFIX_NAME:-prod-}
    volumes:
      # Generated from services.yml — never edit directly. (ADR-0014)
      - ./generated/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # The dashboard tunnel rule targets `caddy:80`. This alias makes that
        # name resolve to prod-caddy (or dev-caddy) without the rule needing
        # to know the ${ENV} prefix.
        aliases:
          - caddy
      apps: {}
    healthcheck:
      # /healthz is served by the generated Caddyfile.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # One instance; one database and one role per service (ADR-0005). The
  # superuser bootstraps those roles and is used by nothing else.
  #
  # ON `data` ONLY. Not `apps`, not `edge`. `net-data` is internal: true, so
  # this container has no route to the internet and cannot be reached from
  # anything that has not explicitly joined `data` (ADR-0004). Combined with
  # no `ports:`, the database is unreachable from the host and the world.
  postgres:
    image: postgres:17.7-alpine
    container_name: ${ENV_PREFIX_NAME:-prod-}postgres
    restart: unless-stopped
    # Replaces the image's postgresql.conf wholesale — see that file's header.
    command: -c config_file=/etc/postgresql/postgresql.conf
    environment:
      # The image's own bootstrap variables. POSTGRES_SUPER_* is the .env
      # naming (ADR-0006); mapped here rather than renamed in .env, because
      # the image only reads POSTGRES_USER/POSTGRES_PASSWORD.
      POSTGRES_USER: ${POSTGRES_SUPER_USER:?POSTGRES_SUPER_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?POSTGRES_SUPER_PASSWORD is not set in .env}
      # Deliberately NOT one of the service databases: `postgres` stays the
      # maintenance database so no application DB is special.
      POSTGRES_DB: postgres
      # Data in a subdirectory of the mount, not at its root. Without this, a
      # lost+found or any stray file makes Postgres refuse to initialise.
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Europe/Berlin}
      # Which services the init script provisions. Kept here so the script
      # does not restate the service list (ADR-0014).
      POSTGRES_SERVICES: "n8n longevity"
      POSTGRES_N8N_PASSWORD: ${POSTGRES_N8N_PASSWORD:?POSTGRES_N8N_PASSWORD is not set in .env}
      POSTGRES_LONGEVITY_PASSWORD: ${POSTGRES_LONGEVITY_PASSWORD:?POSTGRES_LONGEVITY_PASSWORD is not set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory only (ADR-0005).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      data:
        # Lets a service reach `postgres` without knowing the ${ENV} prefix,
        # matching the `caddy` alias rationale above.
        aliases:
          - postgres
    healthcheck:
      # -h 127.0.0.1 forces a real TCP check. Without it pg_isready can pass
      # against the unix socket while TCP — how every client connects — is
      # still refusing. start_period covers first-boot role provisioning.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres -h 127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Hard cap above the ~1 GB config budget, so a runaway query is contained
    # instead of taking the host down with it.
    deploy:
      resources:
        limits:
          # Lowered 1280M -> 768M in M11 to make room for the agent runtimes.
          # Postgres's real ceiling here is shared_buffers (256MB) plus
          # work_mem (8MB) x concurrent sorts, plus per-connection overhead —
          # postgresql.conf caps connections at 100 and each service role at
          # 20. Measured use was 89 MB on 2026-08-01. 768M leaves ~8x headroom
          # over observed and still covers a maintenance_work_mem (128MB)
          # VACUUM running alongside normal traffic.
          memory: 768M
    security_opt:
      - no-new-privileges:true

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Queue backend for n8n (M6) and cache for later services. Same network
  # reasoning as Postgres: `data` only, no published port.
  redis:
    image: redis:7.4.6-alpine
    container_name: ${ENV_PREFIX_NAME:-prod-}redis
    restart: unless-stopped
    # The password comes from the environment at startup, never from the
    # committed config file (ADR-0006). sh -c so $REDIS_PASSWORD is expanded by
    # the container's shell — $$ keeps Compose from substituting it here.
    command: >
      sh -c 'exec redis-server /usr/local/etc/redis/redis.conf
      --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      data:
        aliases:
          - redis
    healthcheck:
      # Authenticated ping: an unauthenticated one would pass even if
      # requirepass were silently misconfigured, which is the failure that
      # matters here. --no-auth-warning keeps the log readable.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # Above redis.conf's 256MB maxmemory, leaving room for AOF rewrite
          # and copy-on-write during a background save.
          #
          # Lowered 512M -> 320M in M11. It must stay ABOVE maxmemory (256MB)
          # or the OOM killer, not the eviction policy, decides what goes —
          # and redis.conf sets `noeviction`, so Redis would rather error than
          # drop data. 320M keeps 64M for fork-time copy-on-write, which is
          # ample at the 13 MB actually in use (measured 2026-08-01). The cap
          # exists for the fork, not the steady state.
          memory: 320M
    security_opt:
      - no-new-privileges:true

  # ── n8n ───────────────────────────────────────────────────────────────────
  # The first real service (M6). Workflow automation; holds credentials for
  # everything it integrates with, which makes it the most security-sensitive
  # thing on the host so far.
  #
  # ON BOTH `apps` AND `data`: Caddy reaches it over `apps`, and it reaches
  # Postgres and Redis over `data`. It is NOT on `edge` — nothing but Caddy and
  # the tunnel belongs there (ADR-0004).
  #
  # AUTHENTICATION IS AT THE EDGE, NOT HERE.
  #   `access: private` in services.yml means Cloudflare Access gates this
  #   hostname before a request ever reaches the tunnel. n8n's own user
  #   management is a second layer, not the primary one. If the Access policy is
  #   missing, this is exposed to the internet — see docs/milestones/M6.md for
  #   the audit step. That policy is a manual dashboard action (ADR-0003).
  n8n:
    image: n8nio/n8n:2.32.6
    container_name: ${ENV_PREFIX_NAME:-prod-}n8n
    restart: unless-stopped
    environment:
      # --- Database ---------------------------------------------------------
      # Its own database and role, no rights to any other (ADR-0005).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_N8N_PASSWORD:?POSTGRES_N8N_PASSWORD is not set in .env}

      # --- Credential encryption -------------------------------------------
      # Encrypts every credential n8n stores. If this value is lost or changed,
      # every stored credential becomes unreadable — the single most important
      # variable here, and the reason .env must be in the backup set (ADR-0009).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is not set in .env}

      # --- Public URL and proxy awareness -----------------------------------
      # n8n builds webhook URLs and OAuth callbacks from these. Wrong values
      # produce webhooks that point somewhere unreachable — a failure that only
      # shows up when an external service tries to call back.
      N8N_HOST: n8n${ENV_PREFIX-}.${DOMAIN:?DOMAIN is not set in .env}
      N8N_PORT: 5678
      # https even though the internal hop is http: this describes the PUBLIC
      # scheme, which is what belongs in a webhook URL. Cloudflare terminates
      # TLS (ADR-0003).
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n${ENV_PREFIX-}.${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://n8n${ENV_PREFIX-}.${DOMAIN}/
      # Trust the proxy in front of us so client IPs in logs are real rather
      # than the Docker bridge address.
      N8N_PROXY_HOPS: 1

      # --- Node heap --------------------------------------------------------
      # State the V8 heap ceiling instead of letting V8 infer one from the
      # cgroup limit. Inference is what caused the M11 crash loop (see the
      # memory limit below): a limit change silently moved the heap ceiling
      # under a workload that had not changed at all.
      #
      # Held below the 768M container limit so V8 hits ITS ceiling first and
      # fails with a JS stack trace, rather than the kernel OOM-killer picking
      # the process — or another one.
      NODE_OPTIONS: --max-old-space-size=640

      # --- Operational ------------------------------------------------------
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
      # Prune execution history. Without this the executions table grows
      # without limit and eventually dominates both the database and backups.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336        # hours (14 days)
      # Keep failures longer than successes: a failure you cannot inspect is
      # the one you needed.
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"

      # Opt out of telemetry and version-check callouts.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # Silence the "permissions 0644 are too wide" nag on the config file and
      # enforce the stricter mode it wants.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # Block filesystem access from Code nodes. n8n is reachable by exactly
      # one authenticated operator, but a workflow that reads /etc is still a
      # capability nothing here needs.
      NODES_EXCLUDE: '["n8n-nodes-base.readWriteFile","n8n-nodes-base.executeCommand"]'
    volumes:
      # Holds the instance ID and settings file. The DATA that matters lives in
      # Postgres, so this volume is small — but it is still in the backup set.
      - n8n_data:/home/node/.n8n
    networks:
      - apps
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /healthz is n8n's own endpoint and the path declared in services.yml.
      # wget rather than curl: the image ships busybox wget, not curl.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # n8n runs database migrations on first boot, which on a cold start takes
      # appreciably longer than a normal restart.
      start_period: 120s
    deploy:
      resources:
        limits:
          # Node's default heap plus workflow execution overhead. Bounded so a
          # runaway workflow cannot take the host down with it.
          #
          # RAISED BACK 512M -> 768M on 2026-08-02 after the 512M cap put n8n
          # into a crash loop: 6131 restarts, dying ~18s into every boot with
          # "Ineffective mark-compacts near heap limit".
          #
          # The M11 reasoning was measured but measured the WRONG NUMBER. RSS
          # was 296 MB, so 512M looked like slack. But V8 sizes its heap ceiling
          # from the CGROUP LIMIT at startup, not from observed RSS — halving
          # the limit halved the ceiling, and n8n's boot-time heap sat above it.
          # A container can therefore OOM its runtime while `docker stats` shows
          # it at 29% of the limit, which is exactly what this one did.
          #
          # NODE_OPTIONS above makes the ceiling explicit rather than inferred,
          # so this failure cannot recur silently if the limit is tuned again.
          memory: 768M
    security_opt:
      - no-new-privileges:true

  # ── Uptime Kuma ───────────────────────────────────────────────────────────
  # Service monitoring (M8). Chosen over Portainer-style tooling because it
  # needs no Docker socket — it makes HTTP requests like any other client, so a
  # compromise here does not become root on the host (ADR-0008).
  #
  # THE LIMITATION THIS DOES NOT SOLVE
  #   Kuma runs inside the stack it watches. If the host dies, or Docker dies,
  #   Kuma dies with it and sends nothing — the classic "who watches the
  #   watchman" gap. It reliably catches ONE service failing, which is the
  #   common case; it cannot report its own death. An external check (a free
  #   Uptime Robot hitting /healthz, or Healthchecks.io watching the backup
  #   timer) is the honest complement, and is listed as M8 follow-up.
  status:
    image: louislam/uptime-kuma:2.4.0
    container_name: ${ENV_PREFIX_NAME:-prod-}status
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Kuma is behind Caddy behind the tunnel; without this it builds links
      # against the container's own hostname.
      UPTIME_KUMA_PORT: 3001
    volumes:
      - status_data:/app/data
    networks:
      # apps only. Kuma checks services over HTTP through the apps network and
      # reaches ntfy the same way. It is deliberately NOT on data — a monitor
      # has no business being able to open a database socket (ADR-0004).
      - apps
    healthcheck:
      # curl, NOT wget: the Kuma 2.x image ships curl and has no wget, so a
      # wget probe fails with "not found" and reports the service unhealthy
      # while it is actually fine. Verified what the image contains rather than
      # assuming the busybox toolset other images provide.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
    security_opt:
      - no-new-privileges:true

  # ── ntfy ──────────────────────────────────────────────────────────────────
  # Push relay: turns "Kuma noticed something" into a notification on your
  # phone. Monitoring that only shows up on a dashboard helps precisely when
  # you are already watching, which is when you need it least.
  #
  # Config is a mounted file rather than environment variables because the
  # access-control defaults matter and belong somewhere reviewable — see
  # ntfy/server.yml, particularly auth-default-access: deny-all.
  ntfy:
    image: binwiederhier/ntfy:v2.26.3
    container_name: ${ENV_PREFIX_NAME:-prod-}ntfy
    restart: unless-stopped
    # `serve` is required: the image's entrypoint is the ntfy binary itself, so
    # without a subcommand it prints help and exits.
    command: serve
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_data:/var/lib/ntfy      # user.db — accounts and per-topic ACLs
      - ntfy_cache:/var/cache/ntfy   # undelivered messages across restarts
    networks:
      - apps
    healthcheck:
      # /v1/health is ntfy's own endpoint and returns JSON with "healthy":true.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80/v1/health | grep -q 'true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # ── portfolio — the one public thing on this host ─────────────────────────
  # A static personal site on the bare domain (M12). It is the first
  # `access: public` service since whoami was removed in M11, so the reasoning
  # is worth stating rather than implying.
  #
  # WHAT MAKES IT SAFE TO EXPOSE, where whoami was not worth the risk:
  #   - It serves FILES. No request echo, no application logic, no input to
  #     parse, no session, no database.
  #   - `apps` ONLY. It cannot reach Postgres, Redis or the agent network, so
  #     there is nothing to take from it and nowhere to pivot to.
  #   - read_only with a tmpfs for Caddy's scratch space: even a write
  #     primitive has nowhere to persist.
  #   - The site is mounted :ro from the repo, so the container cannot alter
  #     what it serves.
  #
  # The content lives in Git and is deployed by rsync like everything else —
  # there is no build step and no CMS to keep patched, which is the point.
  portfolio:
    image: caddy:2.10.2-alpine
    container_name: ${ENV_PREFIX_NAME:-prod-}portfolio
    restart: unless-stopped
    volumes:
      - ./portfolio/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portfolio/site:/srv/site:ro
    networks:
      - apps
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # A static file server for two files. This is already generous.
          memory: 64M
    read_only: true
    tmpfs:
      # Caddy wants a writable data/config dir even with `admin off`.
      - /data
      - /config
    security_opt:
      - no-new-privileges:true

  # ── longevity — Health Score Platform (DHBW MVP) ──────────────────────────
  # Frontend (Nginx serving Vite build). Caddy routes non-/api requests here.
  # Image built by the LONGEVITY repo CI and pushed to GHCR.
  longevity:
    image: ${LONGEVITY_WEB_IMAGE:?LONGEVITY_WEB_IMAGE is not set in .env}
    container_name: ${ENV_PREFIX_NAME:-prod-}longevity
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - apps
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  # Backend (Fastify). Caddy routes /api/* requests here.
  longevity-api:
    image: ${LONGEVITY_API_IMAGE:?LONGEVITY_API_IMAGE is not set in .env}
    container_name: ${ENV_PREFIX_NAME:-prod-}longevity-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://longevity:${POSTGRES_LONGEVITY_PASSWORD:?POSTGRES_LONGEVITY_PASSWORD is not set in .env}@postgres:5432/longevity?sslmode=disable
      SESSION_SECRET: ${LONGEVITY_SESSION_SECRET:?LONGEVITY_SESSION_SECRET is not set in .env}
      SIGNING_KEY_PRIVATE: ${LONGEVITY_SIGNING_KEY_PRIVATE:?LONGEVITY_SIGNING_KEY_PRIVATE is not set in .env}
      SIGNING_KEY_PUBLIC: ${LONGEVITY_SIGNING_KEY_PUBLIC:?LONGEVITY_SIGNING_KEY_PUBLIC is not set in .env}
      PUBLIC_BASE_URL: https://longevity.${DOMAIN:?DOMAIN is not set in .env}
      SMTP_URL: ${LONGEVITY_SMTP_URL:-smtp://localhost:1025}
      NODE_ENV: production
      COMMIT_SHA: ${LONGEVITY_COMMIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apps
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # ── earnings-alpha — portfolio piece, static nginx build ───────────────────
  # Image built and pushed by its own repo's CI to GHCR; pinned by digest
  # (ADR-0011's M7 exception, same as longevity). No backend, no database,
  # no credential inside it — `networks: [apps]` only.
  #
  # NOT CURRENTLY STARTED FROM HERE (2026-09-13): `docker compose up` fails
  # to interpolate the WHOLE file — including this block — whenever
  # LONGEVITY_SIGNING_KEY_PRIVATE is unset in .env, which it currently is.
  # Faking that secret to unblock this service was rejected (it's a real
  # longevity-api credential). Running instead via compose/earnings-alpha.yml
  # in the meantime — see that file for how to retire it and bring this block
  # back into service once the missing longevity variable is set for real.
  earnings-alpha:
    image: ghcr.io/max-imalgutaussehend/earnings-call-alpha@sha256:7d4712c8e70365baa20e2f36600763b6fa89febbb83dcf9f86ae531acf870cd0
    container_name: ${ENV_PREFIX_NAME:-prod-}earnings-alpha
    restart: unless-stopped
    volumes:
      # The image's baked-in nginx config listens on 80, which services.yml
      # can't reuse (ntfy already claims it — the generator rejects two
      # enabled services sharing a port number). This overrides only the
      # listen port; everything else about the image is untouched.
      - ./earnings-alpha/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./earnings-alpha/index.html:/usr/share/nginx/html/index.html:ro
      - ./earnings-alpha/favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./earnings-alpha/fonts:/usr/share/nginx/html/fonts:ro
    networks:
      - apps
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first inside this
      # image and nginx only listens on IPv4, so this reported unhealthy while
      # the service was actually fine — reproduced locally 2026-09-14 while
      # building regime-lens (same image family) and fixed here too.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8083/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  # ── regime-lens — portfolio piece, static nginx build ───────────────────────
  # Image built and pushed to GHCR from its own repo
  # (github.com/Max-imalgutaussehend/regime-lens); pinned by digest (ADR-0011's
  # M7 exception, same as longevity and earnings-alpha). No backend, no
  # database, no credential inside it — `networks: [apps]` only.
  #
  # NOT CURRENTLY STARTED FROM HERE (2026-09-14): same reason as earnings-alpha
  # above — `docker compose up` fails to interpolate the WHOLE file whenever
  # LONGEVITY_SIGNING_KEY_PRIVATE is unset in .env. Running instead via
  # compose/regime-lens.yml in the meantime — see that file for how to retire
  # it and bring this block back into service.
  regime-lens:
    image: ghcr.io/max-imalgutaussehend/regime-lens@sha256:08d125668c592e80d5496dc1b2dda32e3e6b11e9ff52a8bfed624d2e03ebbb1d
    container_name: ${ENV_PREFIX_NAME:-prod-}regime-lens
    restart: unless-stopped
    volumes:
      - ./regime-lens/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./regime-lens/index.html:/usr/share/nginx/html/index.html:ro
      - ./regime-lens/favicon.svg:/usr/share/nginx/html/favicon.svg:ro
    networks:
      - apps
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8084/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

volumes:

  caddy_data:
    name: ${ENV_PREFIX_NAME:-prod-}caddy-data
  caddy_config:
    name: ${ENV_PREFIX_NAME:-prod-}caddy-config

  # The two volumes that hold irreplaceable state. Everything else in this
  # stack can be rebuilt from Git; these cannot. They are the reason M5
  # (backups + a rehearsed restore) must land before the first real service
  # writes data here (ADR-0009).
  postgres_data:
    name: ${ENV_PREFIX_NAME:-prod-}postgres-data
  redis_data:
    name: ${ENV_PREFIX_NAME:-prod-}redis-data
  n8n_data:
    name: ${ENV_PREFIX_NAME:-prod-}n8n-data
  status_data:
    name: ${ENV_PREFIX_NAME:-prod-}status-data
  ntfy_data:
    name: ${ENV_PREFIX_NAME:-prod-}ntfy-data
  ntfy_cache:
    name: ${ENV_PREFIX_NAME:-prod-}ntfy-cache
