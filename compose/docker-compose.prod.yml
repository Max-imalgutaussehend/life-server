# =============================================================================
# docker-compose.prod.yml — the production stack.
# =============================================================================
#
# WHY THIS FILE LOOKS THE WAY IT DOES
#   - No `ports:` on anything web-facing. Traffic arrives through the
#     Cloudflare tunnel, which dials OUT. Publishing a port would reopen the
#     public attack surface the tunnel exists to remove. (ADR-0003)
#   - Every named object carries ${ENV_PREFIX_NAME} so a dev stack can run
#     alongside prod without colliding. (ADR-0010)
#   - Image tags are pinned to an explicit minor version, never :latest.
#     Pre-commit rejects :latest. (ADR-0011)
#   - Services join only the networks they need. (ADR-0004)
#
# USAGE (on the server, as deploy)
#   cd /opt/life-server && docker compose up -d
#   Locally: make status / make logs / make health
# =============================================================================

name: ${ENV_PREFIX_NAME:-prod-}life-server

# ── Networks (ADR-0004) ─────────────────────────────────────────────────────
# edge  : tunnel <-> proxy only
# apps  : proxy <-> applications
# data  : applications <-> databases. `internal: true` means NO route to the
#         internet at all — a database container cannot phone home.
networks:
  edge:
    name: ${ENV_PREFIX_NAME:-prod-}net-edge
  apps:
    name: ${ENV_PREFIX_NAME:-prod-}net-apps
  data:
    name: ${ENV_PREFIX_NAME:-prod-}net-data
    internal: true

  # ── agent — where code-executing agent sessions run (M9, step 2) ──────────
  # A FOURTH network, deliberately not a reuse of `apps`.
  #
  # M9 agents execute arbitrary code driven by a model. Anything on `apps` can
  # open a socket to anything else on `apps`, so putting agents there would let
  # a prompt-injected session talk to n8n — which holds credentials for every
  # service it integrates with. `data` would be worse still: direct Postgres.
  #
  # Sessions therefore get their own segment. A container here can reach only
  # other containers explicitly placed here. It cannot see Postgres, Redis,
  # n8n, Caddy or the tunnel.
  #
  # NOT internal: true — Claude Code must reach api.anthropic.com. That is the
  # accepted asymmetry: egress is allowed, so the mitigation is that no
  # long-lived secret is ever present in the workspace to exfiltrate.
  agent:
    name: ${ENV_PREFIX_NAME:-prod-}net-agent

services:

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────
  # Outbound-only. Holds a persistent connection to Cloudflare's edge and
  # forwards inbound requests to Caddy. Never listens on a host port.
  # NOTE ON TOKEN MODE (dashboard-managed):
  #   A token-run tunnel takes its ingress rules from the Cloudflare dashboard
  #   and IGNORES any local config.yml. That splits the source of truth, which
  #   ADR-0014 exists to prevent — so the dashboard is kept deliberately empty
  #   with a single wildcard rule pointing at Caddy, and Caddy (driven by
  #   services.yml) does all real routing. One dashboard rule, set once, never
  #   touched again as services are added.
  #
  #   Migrating to a locally-managed tunnel (credentials file + config.yml) is
  #   the cleaner end state and is tracked for M7, when SOPS makes storing the
  #   credentials file safe.
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    container_name: ${ENV_PREFIX_NAME:-prod-}cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is not set in .env}
      TUNNEL_METRICS: 0.0.0.0:2000
    networks:
      - edge
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      caddy:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── Caddy ─────────────────────────────────────────────────────────────────
  # Reverse proxy. Deliberately NOT the TLS terminator (Cloudflare is), and
  # deliberately not publishing 80/443. Kept because it owns routing and is
  # the seam that makes future Tailscale/LAN ingress a config change rather
  # than a rebuild.
  caddy:
    image: caddy:2.10.2-alpine
    container_name: ${ENV_PREFIX_NAME:-prod-}caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env}
      ENV_PREFIX: ${ENV_PREFIX-}
      ENV_PREFIX_NAME: ${ENV_PREFIX_NAME:-prod-}
    volumes:
      # Generated from services.yml — never edit directly. (ADR-0014)
      - ./generated/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # The dashboard tunnel rule targets `caddy:80`. This alias makes that
        # name resolve to prod-caddy (or dev-caddy) without the rule needing
        # to know the ${ENV} prefix.
        aliases:
          - caddy
      apps: {}
      # M14: Caddy also joins `agent`, to reach OpenClaw's own web chat.
      #
      # This is a deliberate widening of ADR-0004 and worth being precise
      # about: it lets Caddy reach INTO the agent segment. It does NOT let the
      # agent segment reach out — a container there still cannot open a socket
      # to Postgres, Redis or n8n, which is what the segment exists to prevent.
      #
      # Caddy is a reverse proxy with no credentials of its own, so being on a
      # third network costs little. The alternative — publishing OpenClaw's
      # port on the host — would be far worse (ADR-0003).
      agent: {}
    healthcheck:
      # /healthz is served by the generated Caddyfile.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # One instance; one database and one role per service (ADR-0005). The
  # superuser bootstraps those roles and is used by nothing else.
  #
  # ON `data` ONLY. Not `apps`, not `edge`. `net-data` is internal: true, so
  # this container has no route to the internet and cannot be reached from
  # anything that has not explicitly joined `data` (ADR-0004). Combined with
  # no `ports:`, the database is unreachable from the host and the world.
  postgres:
    image: postgres:17.7-alpine
    container_name: ${ENV_PREFIX_NAME:-prod-}postgres
    restart: unless-stopped
    # Replaces the image's postgresql.conf wholesale — see that file's header.
    command: -c config_file=/etc/postgresql/postgresql.conf
    environment:
      # The image's own bootstrap variables. POSTGRES_SUPER_* is the .env
      # naming (ADR-0006); mapped here rather than renamed in .env, because
      # the image only reads POSTGRES_USER/POSTGRES_PASSWORD.
      POSTGRES_USER: ${POSTGRES_SUPER_USER:?POSTGRES_SUPER_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?POSTGRES_SUPER_PASSWORD is not set in .env}
      # Deliberately NOT one of the service databases: `postgres` stays the
      # maintenance database so no application DB is special.
      POSTGRES_DB: postgres
      # Data in a subdirectory of the mount, not at its root. Without this, a
      # lost+found or any stray file makes Postgres refuse to initialise.
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Europe/Berlin}
      # Which services the init script provisions. Kept here so the script
      # does not restate the service list (ADR-0014).
      POSTGRES_SERVICES: "n8n paperclip hermes"
      POSTGRES_N8N_PASSWORD: ${POSTGRES_N8N_PASSWORD:?POSTGRES_N8N_PASSWORD is not set in .env}
      POSTGRES_PAPERCLIP_PASSWORD: ${POSTGRES_PAPERCLIP_PASSWORD:?POSTGRES_PAPERCLIP_PASSWORD is not set in .env}
      POSTGRES_HERMES_PASSWORD: ${POSTGRES_HERMES_PASSWORD:?POSTGRES_HERMES_PASSWORD is not set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory only (ADR-0005).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      data:
        # Lets a service reach `postgres` without knowing the ${ENV} prefix,
        # matching the `caddy` alias rationale above.
        aliases:
          - postgres
    healthcheck:
      # -h 127.0.0.1 forces a real TCP check. Without it pg_isready can pass
      # against the unix socket while TCP — how every client connects — is
      # still refusing. start_period covers first-boot role provisioning.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres -h 127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Hard cap above the ~1 GB config budget, so a runaway query is contained
    # instead of taking the host down with it.
    deploy:
      resources:
        limits:
          # Lowered 1280M -> 768M in M11 to make room for the agent runtimes.
          # Postgres's real ceiling here is shared_buffers (256MB) plus
          # work_mem (8MB) x concurrent sorts, plus per-connection overhead —
          # postgresql.conf caps connections at 100 and each service role at
          # 20. Measured use was 89 MB on 2026-08-01. 768M leaves ~8x headroom
          # over observed and still covers a maintenance_work_mem (128MB)
          # VACUUM running alongside normal traffic.
          memory: 768M
    security_opt:
      - no-new-privileges:true

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Queue backend for n8n (M6) and cache for later services. Same network
  # reasoning as Postgres: `data` only, no published port.
  redis:
    image: redis:7.4.6-alpine
    container_name: ${ENV_PREFIX_NAME:-prod-}redis
    restart: unless-stopped
    # The password comes from the environment at startup, never from the
    # committed config file (ADR-0006). sh -c so $REDIS_PASSWORD is expanded by
    # the container's shell — $$ keeps Compose from substituting it here.
    command: >
      sh -c 'exec redis-server /usr/local/etc/redis/redis.conf
      --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      data:
        aliases:
          - redis
    healthcheck:
      # Authenticated ping: an unauthenticated one would pass even if
      # requirepass were silently misconfigured, which is the failure that
      # matters here. --no-auth-warning keeps the log readable.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # Above redis.conf's 256MB maxmemory, leaving room for AOF rewrite
          # and copy-on-write during a background save.
          #
          # Lowered 512M -> 320M in M11. It must stay ABOVE maxmemory (256MB)
          # or the OOM killer, not the eviction policy, decides what goes —
          # and redis.conf sets `noeviction`, so Redis would rather error than
          # drop data. 320M keeps 64M for fork-time copy-on-write, which is
          # ample at the 13 MB actually in use (measured 2026-08-01). The cap
          # exists for the fork, not the steady state.
          memory: 320M
    security_opt:
      - no-new-privileges:true

  # ── n8n ───────────────────────────────────────────────────────────────────
  # The first real service (M6). Workflow automation; holds credentials for
  # everything it integrates with, which makes it the most security-sensitive
  # thing on the host so far.
  #
  # ON BOTH `apps` AND `data`: Caddy reaches it over `apps`, and it reaches
  # Postgres and Redis over `data`. It is NOT on `edge` — nothing but Caddy and
  # the tunnel belongs there (ADR-0004).
  #
  # AUTHENTICATION IS AT THE EDGE, NOT HERE.
  #   `access: private` in services.yml means Cloudflare Access gates this
  #   hostname before a request ever reaches the tunnel. n8n's own user
  #   management is a second layer, not the primary one. If the Access policy is
  #   missing, this is exposed to the internet — see docs/milestones/M6.md for
  #   the audit step. That policy is a manual dashboard action (ADR-0003).
  n8n:
    image: n8nio/n8n:2.32.6
    container_name: ${ENV_PREFIX_NAME:-prod-}n8n
    restart: unless-stopped
    environment:
      # --- Database ---------------------------------------------------------
      # Its own database and role, no rights to any other (ADR-0005).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_N8N_PASSWORD:?POSTGRES_N8N_PASSWORD is not set in .env}

      # --- Credential encryption -------------------------------------------
      # Encrypts every credential n8n stores. If this value is lost or changed,
      # every stored credential becomes unreadable — the single most important
      # variable here, and the reason .env must be in the backup set (ADR-0009).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is not set in .env}

      # --- Public URL and proxy awareness -----------------------------------
      # n8n builds webhook URLs and OAuth callbacks from these. Wrong values
      # produce webhooks that point somewhere unreachable — a failure that only
      # shows up when an external service tries to call back.
      N8N_HOST: n8n${ENV_PREFIX-}.${DOMAIN:?DOMAIN is not set in .env}
      N8N_PORT: 5678
      # https even though the internal hop is http: this describes the PUBLIC
      # scheme, which is what belongs in a webhook URL. Cloudflare terminates
      # TLS (ADR-0003).
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n${ENV_PREFIX-}.${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://n8n${ENV_PREFIX-}.${DOMAIN}/
      # Trust the proxy in front of us so client IPs in logs are real rather
      # than the Docker bridge address.
      N8N_PROXY_HOPS: 1

      # --- Node heap --------------------------------------------------------
      # State the V8 heap ceiling instead of letting V8 infer one from the
      # cgroup limit. Inference is what caused the M11 crash loop (see the
      # memory limit below): a limit change silently moved the heap ceiling
      # under a workload that had not changed at all.
      #
      # Held below the 768M container limit so V8 hits ITS ceiling first and
      # fails with a JS stack trace, rather than the kernel OOM-killer picking
      # the process — or another one.
      NODE_OPTIONS: --max-old-space-size=640

      # --- Operational ------------------------------------------------------
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
      # Prune execution history. Without this the executions table grows
      # without limit and eventually dominates both the database and backups.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336        # hours (14 days)
      # Keep failures longer than successes: a failure you cannot inspect is
      # the one you needed.
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"

      # Opt out of telemetry and version-check callouts.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # Silence the "permissions 0644 are too wide" nag on the config file and
      # enforce the stricter mode it wants.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # Block filesystem access from Code nodes. n8n is reachable by exactly
      # one authenticated operator, but a workflow that reads /etc is still a
      # capability nothing here needs.
      NODES_EXCLUDE: '["n8n-nodes-base.readWriteFile","n8n-nodes-base.executeCommand"]'
    volumes:
      # Holds the instance ID and settings file. The DATA that matters lives in
      # Postgres, so this volume is small — but it is still in the backup set.
      - n8n_data:/home/node/.n8n
    networks:
      - apps
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /healthz is n8n's own endpoint and the path declared in services.yml.
      # wget rather than curl: the image ships busybox wget, not curl.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # n8n runs database migrations on first boot, which on a cold start takes
      # appreciably longer than a normal restart.
      start_period: 120s
    deploy:
      resources:
        limits:
          # Node's default heap plus workflow execution overhead. Bounded so a
          # runaway workflow cannot take the host down with it.
          #
          # RAISED BACK 512M -> 768M on 2026-08-02 after the 512M cap put n8n
          # into a crash loop: 6131 restarts, dying ~18s into every boot with
          # "Ineffective mark-compacts near heap limit".
          #
          # The M11 reasoning was measured but measured the WRONG NUMBER. RSS
          # was 296 MB, so 512M looked like slack. But V8 sizes its heap ceiling
          # from the CGROUP LIMIT at startup, not from observed RSS — halving
          # the limit halved the ceiling, and n8n's boot-time heap sat above it.
          # A container can therefore OOM its runtime while `docker stats` shows
          # it at 29% of the limit, which is exactly what this one did.
          #
          # NODE_OPTIONS above makes the ceiling explicit rather than inferred,
          # so this failure cannot recur silently if the limit is tuned again.
          memory: 768M
    security_opt:
      - no-new-privileges:true

  # ── Uptime Kuma ───────────────────────────────────────────────────────────
  # Service monitoring (M8). Chosen over Portainer-style tooling because it
  # needs no Docker socket — it makes HTTP requests like any other client, so a
  # compromise here does not become root on the host (ADR-0008).
  #
  # THE LIMITATION THIS DOES NOT SOLVE
  #   Kuma runs inside the stack it watches. If the host dies, or Docker dies,
  #   Kuma dies with it and sends nothing — the classic "who watches the
  #   watchman" gap. It reliably catches ONE service failing, which is the
  #   common case; it cannot report its own death. An external check (a free
  #   Uptime Robot hitting /healthz, or Healthchecks.io watching the backup
  #   timer) is the honest complement, and is listed as M8 follow-up.
  status:
    image: louislam/uptime-kuma:2.4.0
    container_name: ${ENV_PREFIX_NAME:-prod-}status
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Kuma is behind Caddy behind the tunnel; without this it builds links
      # against the container's own hostname.
      UPTIME_KUMA_PORT: 3001
    volumes:
      - status_data:/app/data
    networks:
      # apps only. Kuma checks services over HTTP through the apps network and
      # reaches ntfy the same way. It is deliberately NOT on data — a monitor
      # has no business being able to open a database socket (ADR-0004).
      #
      # AND DELIBERATELY NOT ON `agent`, even though M11 added a monitor for
      # cliproxy which lives there. Joining a network is bidirectional: it
      # would not just let Kuma poll the proxy, it would let every
      # code-executing agent session reach Kuma — which holds the ntfy
      # publish token, i.e. the ability to send YOU a forged all-clear. That
      # inverts the one alert that has to stay trustworthy (see M8).
      #
      # The proxy is monitored from inside the agent segment instead, by
      # Paperclip's own health endpoint. See scripts/seed-monitors.sh.
      - apps
    healthcheck:
      # curl, NOT wget: the Kuma 2.x image ships curl and has no wget, so a
      # wget probe fails with "not found" and reports the service unhealthy
      # while it is actually fine. Verified what the image contains rather than
      # assuming the busybox toolset other images provide.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
    security_opt:
      - no-new-privileges:true

  # ── ntfy ──────────────────────────────────────────────────────────────────
  # Push relay: turns "Kuma noticed something" into a notification on your
  # phone. Monitoring that only shows up on a dashboard helps precisely when
  # you are already watching, which is when you need it least.
  #
  # Config is a mounted file rather than environment variables because the
  # access-control defaults matter and belong somewhere reviewable — see
  # ntfy/server.yml, particularly auth-default-access: deny-all.
  ntfy:
    image: binwiederhier/ntfy:v2.26.3
    container_name: ${ENV_PREFIX_NAME:-prod-}ntfy
    restart: unless-stopped
    # `serve` is required: the image's entrypoint is the ntfy binary itself, so
    # without a subcommand it prints help and exits.
    command: serve
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_data:/var/lib/ntfy      # user.db — accounts and per-topic ACLs
      - ntfy_cache:/var/cache/ntfy   # undelivered messages across restarts
    networks:
      - apps
    healthcheck:
      # /v1/health is ntfy's own endpoint and returns JSON with "healthy":true.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80/v1/health | grep -q 'true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # ── portfolio — the one public thing on this host ─────────────────────────
  # A static personal site on the bare domain (M12). It is the first
  # `access: public` service since whoami was removed in M11, so the reasoning
  # is worth stating rather than implying.
  #
  # WHAT MAKES IT SAFE TO EXPOSE, where whoami was not worth the risk:
  #   - It serves FILES. No request echo, no application logic, no input to
  #     parse, no session, no database.
  #   - `apps` ONLY. It cannot reach Postgres, Redis or the agent network, so
  #     there is nothing to take from it and nowhere to pivot to.
  #   - read_only with a tmpfs for Caddy's scratch space: even a write
  #     primitive has nowhere to persist.
  #   - The site is mounted :ro from the repo, so the container cannot alter
  #     what it serves.
  #
  # The content lives in Git and is deployed by rsync like everything else —
  # there is no build step and no CMS to keep patched, which is the point.
  portfolio:
    image: caddy:2.10.2-alpine
    container_name: ${ENV_PREFIX_NAME:-prod-}portfolio
    restart: unless-stopped
    volumes:
      - ./portfolio/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portfolio/site:/srv/site:ro
    networks:
      - apps
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # A static file server for two files. This is already generous.
          memory: 64M
    read_only: true
    tmpfs:
      # Caddy wants a writable data/config dir even with `admin off`.
      - /data
      - /config
    security_opt:
      - no-new-privileges:true

  # ── Paperclip ─────────────────────────────────────────────────────────────
  # The real upstream Paperclip (M11, ADR-0020), replacing the hand-written Go
  # UI that M9 built. Upstream ships the board, the agent adapters and the
  # invite/join flow — all of which the Go UI would have had to reimplement.
  #
  # WHY THE GO UI IS GONE: it rendered a ticket table and nothing else. Once the
  # agents needed a board, sub-agents and an adapter protocol, maintaining a
  # parallel implementation bought nothing. Its schema is NOT reused; Paperclip
  # owns its own migrations (see the `paperclip` database).
  #
  # ON `apps` AND `data`, deliberately NOT on `agent`: it holds the Postgres
  # password, and the agent network exists precisely to keep code-executing
  # sessions away from anything holding credentials (see verify-agent-sandbox).
  # `agent` reaches it through the edge alias below, not by joining `data`.
  #
  # AUTHENTICATION IS AT THE EDGE. `access: private` in services.yml means
  # Cloudflare Access gates paperclip.${DOMAIN} before a request reaches the
  # tunnel. PAPERCLIP_DEPLOYMENT_EXPOSURE=private tells Paperclip it is behind
  # such a proxy so it does not additionally publish itself.
  paperclip:
    # Built by CI from the pinned upstream tag and pushed to our own GHCR
    # namespace — upstream publishes no server image, only agent-runtime-*.
    # Pinned by DIGEST, not tag: a tag is mutable, and a "pinned version" that
    # can move underneath you is the failure ADR-0011 exists to prevent.
    image: ${PAPERCLIP_IMAGE:?PAPERCLIP_IMAGE is not set — see .github/workflows/paperclip-image.yml}
    container_name: ${ENV_PREFIX_NAME:-prod-}paperclip
    restart: unless-stopped
    environment:
      # sslmode=disable is correct here and only here: the connection never
      # leaves the internal `data` bridge, which has no route off the host
      # (ADR-0004). TLS would encrypt a hop that cannot be observed.
      DATABASE_URL: postgres://paperclip:${POSTGRES_PAPERCLIP_PASSWORD:?POSTGRES_PAPERCLIP_PASSWORD is not set in .env}@postgres:5432/paperclip?sslmode=disable
      PORT: 3100
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      # Signs Paperclip's own session cookies and agent JWTs. Upstream refuses
      # to start without it rather than defaulting to something guessable —
      # correct, since a predictable signing key means forgeable sessions.
      #
      # This is the SECOND auth layer, behind Cloudflare Access. M9 argued a
      # weak second layer is a liability; that reasoning does not apply here,
      # because agents authenticate to Paperclip with issued API keys and the
      # invite/join flow needs real accounts. Access gates the browser; this
      # gates the API.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set in .env}
      # Without this, Better Auth derives the origin from the incoming request
      # and warns that "callbacks and redirects may not work correctly". Behind
      # a tunnel that is not theoretical: the request arrives with the internal
      # hostname, so login redirects and invite links would point at
      # prod-paperclip:3100 — a name that resolves only inside Docker.
      BETTER_AUTH_URL: https://paperclip.${DOMAIN:?DOMAIN is not set in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # PAPERCLIP_HOME. Not optional, and not obvious: the container ran for
      # 10 hours with no mount at all, which looked completely healthy because
      # nothing here is needed to SERVE — only to survive.
      #
      # What lives here: the instance config, and the hourly database backups
      # Paperclip takes on its own (it reports "databaseBackup: enabled" at
      # /api/health). Unmounted, those backups sit in the container layer and
      # are destroyed by exactly the event that would make you want them.
      #
      # The same mistake as OpenClaw's /root vs /home/node mount, and the same
      # shape: state written somewhere the volume is not.
      - paperclip_data:/paperclip
    networks:
      - apps
      - data
      # Also on `agent` — the ONE service that bridges it. Agent runtimes hold
      # no database credentials by design (ADR-0019/0020), so they reach the
      # board through Paperclip's API instead. Paperclip is therefore the narrow
      # interface the M9 sandbox assumed: an agent gets endpoints, never a
      # connection string.
      - agent
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # A Node server with a React UI — an order of magnitude above the Go
          # binary it replaces.
          #
          # MEASURED, no longer an estimate: 361 MB after 9 hours of uptime
          # (2026-08-02), against this 640M cap. The guess held.
          #
          # Kept at 640M rather than tightened: Paperclip runs agent sessions
          # and hourly database backups, so steady state is the floor and not
          # the peak. The sum of caps exceeds physical RAM, which is safe only
          # because caps are ceilings rather than reservations — total real use
          # is ~1.2 GB of 3.8 GB.
          memory: 640M
    security_opt:
      - no-new-privileges:true

  # whoami (the M3 vertical-slice test target) was removed in M11. It had
  # served its purpose — it proved Cloudflare -> tunnel -> Caddy -> container
  # worked — and it was the only `access: public` service here, i.e. the one
  # unauthenticated endpoint on the host. Removing it buys ~3 MB of RAM and,
  # more usefully, deletes a public request-echo from a box that now runs
  # agents. See ADR-0020.

  # ── cliproxy — the subscription proxy ─────────────────────────────────────
  # Turns the operator's Claude subscription into an OpenAI-compatible endpoint
  # so Hermes and OpenClaw — which speak provider REST APIs and know nothing
  # about Claude Code sessions — can use it. (ADR-0020)
  #
  # THIS IS THE UNSUPPORTED COMPONENT. A third-party wrapper around an OAuth
  # flow Anthropic can change without notice. Everything else in this file is
  # pinned and reproducible; this one can break while nobody touches it.
  #
  # THE 7-DAY PROBLEM: the Claude OAuth credential expires roughly weekly, and
  # when it does the whole agent system stops SILENTLY — indistinguishable from
  # an empty queue. Uptime Kuma monitors /health for exactly this reason. That
  # monitor is not optional; it is the difference between "it stopped" and "it
  # stopped three days ago".
  #
  # ON `agent` ONLY. It holds the subscription credential, so it is deliberately
  # kept off apps and data — and it is the reason PROXY_API_KEY exists, since
  # otherwise anything on this network could spend the operator's quota.
  cliproxy:
    image: eceasy/cli-proxy-api:v7.2.113
    container_name: ${ENV_PREFIX_NAME:-prod-}cliproxy
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    environment:
      PROXY_API_KEY: ${PROXY_API_KEY:?PROXY_API_KEY is not set in .env}
      # Only so entrypoint.sh can print a copy-pasteable `docker exec` hint
      # naming this actual container when the OAuth credential is missing.
      ENV_PREFIX_NAME: ${ENV_PREFIX_NAME:-prod-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./cliproxy/config.yaml:/etc/cliproxy/config.yaml:ro
      - ./cliproxy/entrypoint.sh:/entrypoint.sh:ro
      # Holds the OAuth credential. A named volume so `docker compose down`
      # does not force an interactive re-login on a headless host.
      - cliproxy_data:/data
    networks:
      - agent
    healthcheck:
      # bash's /dev/tcp, NOT wget or curl: this image ships neither (verified,
      # not assumed — the same mistake the Caddy healthcheck comment warns
      # about, where a missing tool reports "unhealthy" on a service that is
      # actually fine).
      #
      # This proves the port is listening. It deliberately does NOT prove the
      # Claude credential is valid — that is cliproxy-heartbeat's job, because
      # checking it properly costs a real completion and must not run every
      # 30 seconds.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # A Go binary proxying HTTP. Generous.
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # ── cliproxy-heartbeat — proves the credential still works ────────────────
  # The monitor that matters most (M11, ADR-0020). Sends one real completion an
  # hour and pushes the result to Uptime Kuma, so an expired Claude credential
  # surfaces as an alert instead of a board that quietly stops moving.
  #
  # WHY A SEPARATE CONTAINER AND NOT A NETWORK CHANGE
  #   Kuma is on `apps`, cliproxy on `agent`. Putting Kuma on `agent` would let
  #   every code-executing agent session reach it — and Kuma holds the ntfy
  #   publish token, i.e. the ability to send a forged all-clear (M8). This
  #   sidecar bridges the two instead, and it is safe to do so precisely
  #   because it runs a fixed 60-line shell script and never executes
  #   model-chosen code. It is a courier, not an agent.
  #
  #   It is the ONLY container on both networks, and that is deliberate.
  cliproxy-heartbeat:
    image: alpine:3.21
    container_name: ${ENV_PREFIX_NAME:-prod-}cliproxy-heartbeat
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/heartbeat.sh"]
    environment:
      PROXY_HOST: ${ENV_PREFIX_NAME:-prod-}cliproxy
      PROXY_API_KEY: ${PROXY_API_KEY:?PROXY_API_KEY is not set in .env}
      # Minted by Uptime Kuma when the `cliproxy` push monitor is created.
      # Empty means the heartbeat exits loudly rather than pretending to work.
      KUMA_PUSH_URL: ${KUMA_PUSH_URL:-}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-3600}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./cliproxy/heartbeat.sh:/heartbeat.sh:ro
    networks:
      - agent
      - apps
    depends_on:
      cliproxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # A shell loop calling wget once an hour.
          memory: 32M
    security_opt:
      - no-new-privileges:true
    read_only: true

  # ── omniroute — the fallback model router (M13, ADR-0021) ─────────────────
  # WHAT PROBLEM THIS SOLVES
  #   The subscription proxy returns HTTP 400 above a token budget that
  #   OpenClaw's smallest workable prompt already exceeds (measured: 3 tools /
  #   26,380 B fails, 2 tools / 25,910 B passes). Every avenue inside the proxy
  #   was tried first — fewer tools, no skills, all four models, the native
  #   /v1/messages endpoint. The ceiling is account-wide and
  #   protocol-independent, so it cannot be configured away.
  #
  #   This router sits BESIDE the proxy, not in front of it: the subscription is
  #   still tier 1 and answers every request it can. Only a request the proxy
  #   refuses falls through to a second provider. Nothing that works today
  #   starts taking a different path.
  #
  # WHY THIS IS A REVERSAL, AND WHERE IT IS ARGUED
  #   ADR-0018 rejected exactly this shape — "route across dozens of free LLM
  #   providers" — on data-custody grounds, and that reasoning has NOT been
  #   retracted. ADR-0021 records why the trade changed for this one container
  #   and what was given up. Read it before adding a second consumer.
  #
  # NETWORK: `agent` only.
  #   Not `data` (it has no business near Postgres), not `apps` (that is where
  #   n8n's credentials live). It talks to OpenClaw and to the internet, and
  #   that is the whole of its reach.
  #
  # NOT IN services.yml, for the same reason as openclaw and cliproxy: that
  # registry generates PUBLIC routes, and an unauthenticated public router
  # holding provider keys is a credential-exfiltration endpoint.
  # THE IMAGE TAG IS LOAD-BEARING: `3.8.49` is the HEADLESS build (461 MB).
  # `3.8.49-web` is the same release WITH the Next.js dashboard and weighs
  # 874 MB — nearly double, on a host with ~1.8 GB free. Upstream publishes both
  # for every release and the only difference is that suffix. Do not "upgrade"
  # to -web.
  #
  # Pinned by digest as well as tag (ADR-0011): a tag can be moved.
  #
  # This replaced a hand-written Dockerfile. That Dockerfile was built before
  # the registry could be read (the operator's uplink was IPv6-only) and it
  # guessed both the version and the way to disable the dashboard. Both guesses
  # were wrong: the real version is 3.8.49, not 1.0.0, and the dashboard is not
  # an env flag at all — it is a separate image tag, precompiled into the -web
  # build. Upstream's image is also non-root already and handles its own
  # permissions.
  omniroute:
    image: diegosouzapw/omniroute:3.8.49@sha256:92c768c56e2de32c51a0621ef182835018b00b288c9bb235c5c5e4514658c1a1
    container_name: ${ENV_PREFIX_NAME:-prod-}omniroute
    restart: unless-stopped
    # Upstream asks for 40s in its own docker run example: the router flushes
    # SQLite on shutdown, and killing it mid-write is how the provider store
    # gets corrupted.
    stop_grace_period: 40s
    environment:
      # ⚠️ EVERY NAME BELOW WAS READ OUT OF THE IMAGE (/app/.env.example in
      # diegosouzapw/omniroute:3.8.49), not inferred. An earlier version of this
      # block invented OMNIROUTE_DASHBOARD_ENABLED, OMNIROUTE_MEMORY_ENABLED,
      # OMNIROUTE_STEALTH_ENABLED and OMNIROUTE_CONFIG_PATH. NONE of them
      # exist. They would have been ignored in silence — which is exactly why
      # they are named here, so nobody reintroduces them.
      PORT: 20128
      NODE_ENV: production
      TZ: ${TZ:-Europe/Berlin}

      # ── THE ONE THAT MATTERS FOR SECURITY ──────────────────────────────
      # Upstream ships REQUIRE_API_KEY=false. VERIFIED against a running
      # container: GET /v1/models returned 200 with no credential at all.
      # This service sits on `agent`, where containers execute model-chosen
      # code — an unauthenticated router there is a prompt-injected session's
      # free pass to spend provider quota and read stored provider keys.
      REQUIRE_API_KEY: "true"
      # And do not hand the stored keys back out over the API even to an
      # authenticated caller.
      ALLOW_API_KEY_REVEAL: "false"

      # Secrets at rest. STORAGE_ENCRYPTION_KEY is what AES-encrypts the
      # provider credentials in SQLite; losing it means re-entering every
      # provider. JWT/API_KEY_SECRET sign the router's own sessions.
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:?OMNIROUTE_JWT_SECRET is not set in .env}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:?OMNIROUTE_API_KEY_SECRET is not set in .env}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_KEY:?OMNIROUTE_STORAGE_KEY is not set in .env}
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?OMNIROUTE_INITIAL_PASSWORD is not set in .env}

      # ── memory, which is the operator's actual requirement ─────────────
      # "das was am wenigsten speicher zieht aber alles andere hergibt".
      #
      # MEASURED, not estimated: 531 MB RSS at idle with ZERO providers
      # configured, settled over two minutes. The dashboard is NOT an env
      # flag — it is a separate image tag (see the image comment above), and
      # even the headless build still starts its WebSocket daemons.
      #
      # NODE_OPTIONS is the only lever that moved the number: with a 256 MB
      # old-space cap it settled at 376 MB. 320 MB is chosen instead, because
      # 376/400 was 94% of its limit — a container that survives startup and
      # dies under load is worse than one that never starts.
      NODE_OPTIONS: --max-old-space-size=384

      # Turn off what runs on a timer and phones out. Each of these appeared in
      # the probe's startup log doing work this deployment has no use for.
      PRICING_SYNC_ENABLED: "false"
      APP_LOG_TO_FILE: "false"
      # Arena ELO sync fetches public leaderboards every 24h and was already
      # failing with HTTP 429 during the probe. It ranks models; this router
      # has one.
      ARENA_ELO_SYNC_ENABLED: "false"
      # The HTTP inspector is a debugging proxy that can intercept TLS. Not on
      # a host that carries the operator's messages.
      INSPECTOR_HTTP_PROXY_AUTOSTART: "false"
      INSPECTOR_TLS_INTERCEPT: "false"
      # No SOCKS5 egress path. This container talks to cliproxy and, if tier 2
      # is ever keyed, to api.anthropic.com. Nothing else.
      ENABLE_SOCKS5_PROXY: "false"

      # Tier 2 — inert until a key exists. `:-` and NOT `:?`, deliberately:
      # the service must come up and serve tier 1 alone, so a missing key is a
      # degraded fallback rather than a failed boot.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # /app/data — VERIFIED against the image's WORKDIR and upstream's own
      # `docker run` example, not /data as an earlier version of this file
      # assumed. Holds the SQLite database and the AES-encrypted provider
      # credentials; losing it means re-entering every provider by hand.
      #
      # There is no config-file mount, and that is a finding rather than an
      # omission: the image reads no providers.json of any kind. Provider state
      # lives ONLY in SQLite, entered through the API or the dashboard. So this
      # service cannot be made reproducible-from-Git the way every other one
      # here is — see ADR-0021 and scripts/omniroute-providers.sh.
      - omniroute_data:/app/data
    networks:
      - agent
    depends_on:
      # Tier 1 must be up before the router starts taking requests. Without
      # this the first few calls fail against a proxy that is merely still
      # booting, and three failures trip the circuit breaker — parking the
      # subscription for a cooldown and sending traffic to tier 2 for no
      # reason at all.
      cliproxy:
        condition: service_healthy
    healthcheck:
      # node, NOT wget or curl: this image ships NEITHER. Verified by running
      # both in the container — exactly the failure mode the cliproxy
      # healthcheck comment above warns about, caught here before it could
      # report a healthy router as unhealthy forever.
      #
      # /v1/models proves the API is actually serving, not merely that a port
      # is open. A 401 counts as healthy: with REQUIRE_API_KEY=true an
      # unauthenticated probe SHOULD be refused, and a refusal still proves the
      # router is answering.
      test:
        - CMD
        - node
        - -e
        - |
          fetch('http://127.0.0.1:20128/v1/models')
            .then(r => process.exit(r.status < 500 ? 0 : 1))
            .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      # 45s measured: the probe container logged "Embedded services bootstrap
      # complete" around 40s. 90s leaves room on a loaded host rather than
      # restart-looping a service that was merely still starting.
      start_period: 90s
    deploy:
      resources:
        limits:
          # MEASURED, not guessed. An earlier version of this file said 256M on
          # the assumption that env flags would strip the dashboard; the
          # container would have been OOM-killed on first start.
          #
          #   default            531 MB idle, zero providers configured
          #   --max-old-space=256  376 MB — but that is 94% of a 400M limit
          #
          # 512M was tried first and measured 488 MB — 95% of its own limit,
          # i.e. one request away from an OOM kill. 768M with a 384 MB heap cap
          # is where it actually has room.
          #
          # Host budget: 1.4 GB available with everything else up; openclaw
          # holds 512M, cliproxy 256M.
          #
          # This is the honest cost of the operator's "least memory that still
          # gives everything else": the floor is ~500 MB, because the headless
          # image still carries the whole application. There is no smaller
          # configuration of this router — only a smaller router.
          memory: 768M
    security_opt:
      - no-new-privileges:true

  # ── openclaw — the personal assistant ─────────────────────────────────────
  # Point of contact #1: the operator talks to this on WhatsApp, and it talks to
  # Paperclip. Paperclip reaches it through the built-in `openclaw_gateway`
  # adapter over WebSocket. (ADR-0020)
  #
  # `-slim`, not `-browser`: the browser variant bundles Chromium, which this
  # host cannot afford. An assistant that can browse is a later decision with
  # its own memory budget, not a default.
  #
  # NOT IN services.yml, deliberately. That registry generates PUBLIC routes,
  # and this container runs model-chosen code — a public route to it would be an
  # unauthenticated RCE endpoint. WhatsApp connectivity is a QR-paired outbound
  # session, so no inbound route is needed for it to work.
  openclaw:
    image: openclaw/openclaw:2026.7.1-slim
    container_name: ${ENV_PREFIX_NAME:-prod-}openclaw
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      # Model calls now go through the ROUTER, which puts the subscription
      # first and falls through only when it refuses (M13, ADR-0021).
      #
      # This used to point straight at cliproxy:8317. It stopped working: the
      # subscription returns HTTP 400 above an account-wide token budget that
      # this agent's smallest workable prompt already exceeds, and no amount of
      # trimming tools or skills got under it. The router does not fix that
      # ceiling — it stops the ceiling from being the end of the request.
      #
      # cliproxy is NOT bypassed. It is tier 1 inside omniroute.json and still
      # answers everything it can; the subscription remains the primary
      # credential exactly as ADR-0020 intended.
      #
      # Still OPENAI_* and still openai-completions: the router exports the
      # same OpenAI-compatible shape cliproxy did, so openclaw.json needs no
      # change beyond the URL these vars carry.
      OPENAI_BASE_URL: http://${ENV_PREFIX_NAME:-prod-}omniroute:20128/v1
      OPENAI_API_KEY: ${OMNIROUTE_API_KEY:?OMNIROUTE_API_KEY is not set in .env}
      # Gates the gateway itself. Paperclip presents this as a bearer token on
      # the WebSocket connect frame.
      #
      # Upstream's name is OPENCLAW_GATEWAY_TOKEN — verified against the gateway
      # runbook, not guessed. `gateway.auth.token` is the config-file
      # equivalent.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_KEY:?OPENCLAW_GATEWAY_KEY is not set in .env}
      # Port precedence upstream is --port -> OPENCLAW_GATEWAY_PORT ->
      # gateway.port -> 18789. Pinned explicitly so the adapter URL below and
      # the listener cannot drift apart.
      OPENCLAW_GATEWAY_PORT: 18789
      # The config file below is where the model provider is actually declared;
      # the OPENAI_* vars above exist only because it references them as
      # ${OPENAI_BASE_URL} / ${OPENAI_API_KEY}. Setting them without the file
      # would configure nothing.
      OPENCLAW_CONFIG_PATH: /config/openclaw.json
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # /config is a WRITABLE volume, not a read-only bind, and that is a
      # deliberate reversal. OpenClaw treats this directory as its own: it
      # installs plugins into extensions/ and takes a lock file next to the
      # config when it does. A read-only mount fails both, and the WhatsApp
      # channel IS a plugin — so read-only here means no WhatsApp.
      #
      # The repo copy is seeded into the volume by the entrypoint below, which
      # keeps the repo authoritative for content while letting OpenClaw write
      # the sidecar files it needs.
      - openclaw_config:/config
      - ./openclaw/openclaw.json:/seed/openclaw.json:ro
      - ./openclaw/entrypoint.sh:/entrypoint.sh:ro
      # WhatsApp pairs by QR and persists a session. Losing this volume means
      # re-scanning the code from the phone, so it is a named volume, not a
      # bind mount into the ephemeral container filesystem.
      #
      # /home/node, NOT /root: the image runs as the `node` user and writes its
      # state there (observed in the config-audit path it logs). Mounting
      # /root would have persisted an empty directory while the real pairing
      # lived in the container layer and vanished on every recreate.
      - openclaw_data:/home/node/.openclaw
    networks:
      - agent
    depends_on:
      # omniroute, not cliproxy — the router is what this container now talks
      # to, and it in turn waits for cliproxy. Waiting on cliproxy here as well
      # would be redundant.
      omniroute:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Node plus a messaging session. Sized against the 3.7 GB host; see
          # the M11 memory budget for how this number was chosen.
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # ── hermes — the CEO agent ────────────────────────────────────────────────
  # Point of contact #2: the operator builds sub-agents against this in the
  # Paperclip UI. Paperclip drives it through the built-in `hermes_gateway`
  # adapter over HTTP/SSE. (ADR-0020)
  #
  # WHY GATEWAY AND NOT hermes_local: upstream's Dockerfile.hermes is a stub. It
  # boots and then fails with "hermes not on PATH", by its own comment. The
  # gateway adapter is the supported path and has no such gap.
  #
  # Built from a Dockerfile because upstream ships Hermes as a pip package with
  # no official image. Small enough to build on the host, unlike Paperclip.
  hermes:
    build:
      context: ./hermes
    image: life-server/hermes:0.1.0
    container_name: ${ENV_PREFIX_NAME:-prod-}hermes
    restart: unless-stopped
    environment:
      # Same proxy, same single credential.
      #
      # OPENAI_* is NOT enough, and that is not obvious: Hermes maps
      # OPENAI_BASE_URL to its `openai-api` provider, which speaks
      # `codex_responses` — a different protocol from the OpenAI-compatible
      # /v1/chat/completions that CLIProxyAPI exports. With only these set,
      # Hermes falls back to its built-in default provider (OpenRouter) and
      # sends `model: ""`, which openrouter.ai answers with
      # "HTTP 401: Missing Authentication header". That 401 is what left the
      # CEO agent in `error` from 2026-08-03 until 2026-08-24, and it names
      # neither Hermes nor the real cause.
      #
      # LM_* selects the `lmstudio` overlay instead: transport `openai_chat`
      # plus a settable base URL — the only built-in combination that matches
      # what the proxy actually speaks. Both pairs are kept: OPENAI_* for any
      # tool that reads the conventional names, LM_* for what Hermes uses.
      OPENAI_BASE_URL: http://${ENV_PREFIX_NAME:-prod-}cliproxy:8317/v1
      OPENAI_API_KEY: ${PROXY_API_KEY:?PROXY_API_KEY is not set in .env}
      LM_BASE_URL: http://${ENV_PREFIX_NAME:-prod-}cliproxy:8317/v1
      LM_API_KEY: ${PROXY_API_KEY:?PROXY_API_KEY is not set in .env}

      # THE TOOL BUDGET IS LOAD-BEARING, and it is not stored here — it lives
      # in the hermes_data volume (`hermes tools disable ...`). Recorded here
      # because the failure it prevents is silent and expensive to re-diagnose.
      #
      # Above roughly 31 KB of request body, the upstream answers HTTP 400
      # "Third-party apps now draw from your extra usage, not your plan
      # limits" — which reads like a billing problem and is not one. Measured
      # 2026-08-24 against this proxy, bisected tool by tool:
      #   10 tools / 31,032 B  -> 200 OK
      #   11 tools / 31,339 B  -> 400
      # 307 bytes apart, so it is a threshold, not a coincidence.
      #
      # NOTE the number differs from OpenClaw's ~54 KB (see openclaw/
      # entrypoint.sh): that one was measured with different content, so the
      # real limit is evidently token-based rather than byte-based. Do not
      # treat either figure as the constant — measure with `hermes
      # prompt-size` after enabling anything.
      #
      # Currently enabled (10 tools, ~24.5 KB): terminal, file,
      # code_execution, todo, clarify, delegation. Disabled to fit: browser,
      # computer_use, image_gen, tts, vision, web, session_search, cronjob,
      # skills, memory — all either useless headless or not needed by a CEO
      # agent whose job is to plan and delegate.
      # Upstream's name for the gateway key. Paperclip stores the same value as
      # agentDefaultsPayload.apiKey so it can authenticate to Hermes.
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: ${HERMES_GATEWAY_KEY:?HERMES_GATEWAY_KEY is not set in .env}
      # Hermes binds 127.0.0.1 by DEFAULT, which inside a container means "no
      # other container can reach me". The gateway starts, the healthcheck
      # passes (it runs inside, where loopback works), and Paperclip cannot
      # connect to something that looks entirely healthy.
      #
      # 0.0.0.0 here means all interfaces OF THIS CONTAINER, and it is only on
      # net-agent — which has no route off the host (ADR-0004). API_SERVER_KEY
      # is still required on every request; upstream enforces it even on
      # loopback binds.
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - hermes_data:/data
    networks:
      - agent
    depends_on:
      cliproxy:
        condition: service_healthy
    healthcheck:
      # Hermes had NO healthcheck until M11's deploy, and that is exactly how it
      # sat "Up" for ten hours with its API server never started: aiohttp was
      # missing, the gateway logged a WARNING and carried on. A container that
      # reports healthy while serving nothing is worse than one that crashes.
      #
      # Probes the CONTAINER NAME, not 127.0.0.1. Loopback would pass while
      # Hermes was bound loopback-only and unreachable by Paperclip — a health
      # check that succeeds during the outage it exists to detect. Using the
      # routable address makes it test the path that actually matters.
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://${ENV_PREFIX_NAME:-prod-}hermes:8642/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true

volumes:
  # The Claude OAuth credential. Irreplaceable without an interactive browser
  # login, which is the one thing a headless VPS cannot do — so this volume is
  # the difference between a weekly re-auth and a blocked afternoon.
  cliproxy_data:
    name: ${ENV_PREFIX_NAME:-prod-}cliproxy-data

  # Paperclip's instance config and its own hourly database backups.
  paperclip_data:
    name: ${ENV_PREFIX_NAME:-prod-}paperclip-data

  # The WhatsApp pairing. Losing it means re-scanning the QR from the phone.
  openclaw_data:
    name: ${ENV_PREFIX_NAME:-prod-}openclaw-data

  # OpenClaw's config directory, including extensions/ — where the WhatsApp
  # channel plugin is installed. Writable and persistent by necessity: OpenClaw
  # takes a lock file beside the config and installs plugins beneath it.
  openclaw_config:
    name: ${ENV_PREFIX_NAME:-prod-}openclaw-config

  # OmniRoute's SQLite database and AES-encrypted provider credentials, plus
  # the seeded config. Persistent because losing it means re-entering every
  # provider key by hand — the credentials are encrypted at rest inside it and
  # exist nowhere else.
  omniroute_data:
    name: ${ENV_PREFIX_NAME:-prod-}omniroute-data

  hermes_data:
    name: ${ENV_PREFIX_NAME:-prod-}hermes-data

  caddy_data:
    name: ${ENV_PREFIX_NAME:-prod-}caddy-data
  caddy_config:
    name: ${ENV_PREFIX_NAME:-prod-}caddy-config

  # The two volumes that hold irreplaceable state. Everything else in this
  # stack can be rebuilt from Git; these cannot. They are the reason M5
  # (backups + a rehearsed restore) must land before the first real service
  # writes data here (ADR-0009).
  postgres_data:
    name: ${ENV_PREFIX_NAME:-prod-}postgres-data
  redis_data:
    name: ${ENV_PREFIX_NAME:-prod-}redis-data
  n8n_data:
    name: ${ENV_PREFIX_NAME:-prod-}n8n-data
  status_data:
    name: ${ENV_PREFIX_NAME:-prod-}status-data
  ntfy_data:
    name: ${ENV_PREFIX_NAME:-prod-}ntfy-data
  ntfy_cache:
    name: ${ENV_PREFIX_NAME:-prod-}ntfy-cache
