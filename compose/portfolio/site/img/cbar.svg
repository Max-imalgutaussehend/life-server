<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Icon: three bars of different heights, the tallest one filled in, above a baseline">
  <!--
    cbar.svg — icon for the contextual-bandit-agent-router project.

    Three bars of different heights: the estimated value of each arm. The
    winning one is filled solid, the others are outlines — which is exactly
    what the router does, pick the arm with the best current estimate.

    It reads as a bar chart and as a set of slot-machine levers, and the
    algorithm is named after slot machines, so both readings are correct.

    Deliberately NOT a flow diagram. Boxes and arrows at 200px are
    unreadable, and they explain a mechanism to someone still deciding
    whether to care. An icon only has to be recognisable.

    Colours are set as presentation attributes AND in the stylesheet, the
    same belt-and-braces as favicon.svg: a fill that exists only inside a
    media query renders as nothing wherever the query does not apply.
  -->
  <style>
    .frame { stroke: #d4d4d8; }
    .bar   { stroke: #a1a1aa; }
    .win   { fill: #18181b; stroke: #18181b; }
    .base  { stroke: #71717a; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #3f3f46; }
      .bar   { stroke: #71717a; }
      .win   { fill: #e8e8e6; stroke: #e8e8e6; }
      .base  { stroke: #8b8b93; }
    }
  </style>

  <rect class="frame" x="16" y="16" width="168" height="168" rx="14"
        fill="none" stroke="#d4d4d8" stroke-width="6" />

  <!-- two arms not chosen: outline only -->
  <rect class="bar" x="46" y="104" width="26" height="50" rx="4"
        fill="none" stroke="#a1a1aa" stroke-width="6" />
  <rect class="bar" x="130" y="88" width="26" height="66" rx="4"
        fill="none" stroke="#a1a1aa" stroke-width="6" />

  <!-- the arm this round chose: solid, and the tallest -->
  <rect class="win" x="88" y="62" width="26" height="92" rx="4"
        fill="#18181b" stroke="#18181b" stroke-width="6" />

  <line class="base" x1="40" y1="157" x2="162" y2="157"
        stroke="#71717a" stroke-width="6" stroke-linecap="round" />
</svg>
