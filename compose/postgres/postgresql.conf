# =============================================================================
# postgresql.conf — tuning for a shared 3.7 GB host (M4)
# =============================================================================
#
# WHY OVERRIDE THE DEFAULTS AT ALL
#   The image's defaults assume a machine dedicated to Postgres. This host also
#   runs Caddy, cloudflared, n8n and later application containers on 3.7 GB.
#   Left alone, Postgres would plan queries as though the whole machine were
#   its own and the OOM killer would eventually pick a container — which, with
#   `restart: unless-stopped`, looks like a random service flapping rather than
#   a memory problem.
#
# THE BUDGET
#   Postgres is allotted roughly 1 GB of the 3.7 GB total. Everything below is
#   derived from that number, so if the host is resized, change the budget and
#   re-derive rather than tweaking individual values.
#
# HOW THIS FILE IS LOADED
#   Mounted read-only and passed via `-c config_file=`. It therefore fully
#   replaces the image's postgresql.conf; anything not set here takes the
#   built-in default, which is why connection and WAL basics are all explicit.
# =============================================================================

# ── Connections ─────────────────────────────────────────────────────────────
# 100 is the default and is ample: per-role CONNECTION LIMIT is 20 (ADR-0005),
# and only a handful of services exist. Each backend costs a few MB, so raising
# this is a memory decision, not a free one.
listen_addresses = '*'
max_connections = 100

# Reserved so a runaway service cannot lock you out of your own database.
# Without this, "too many connections" also blocks the operator trying to fix it.
superuser_reserved_connections = 3

# ── Memory ──────────────────────────────────────────────────────────────────
# 25% of the ~1 GB budget. Postgres' own page cache.
shared_buffers = 256MB

# NOT an allocation — a hint to the planner about how much OS page cache it can
# expect. Set to roughly what the host actually leaves free for file caching.
effective_cache_size = 768MB

# Per sort/hash operation, and a query can use several at once. Small on
# purpose: work_mem is the classic way a Postgres box runs out of memory,
# because the real ceiling is work_mem x concurrent operations, not work_mem.
work_mem = 8MB

# Used by VACUUM, CREATE INDEX and friends. Larger is genuinely faster here
# and only a few of these run at a time.
maintenance_work_mem = 128MB

# ── Write-ahead log and checkpoints ─────────────────────────────────────────
# `replica` (the default) keeps enough WAL for physical backups and PITR later.
# `minimal` would be marginally faster and would rule out both.
wal_level = replica

min_wal_size = 128MB
max_wal_size = 1GB

# Spread checkpoint writes over most of the interval instead of bursting them.
# On a shared disk, a checkpoint spike is felt by every other container.
checkpoint_completion_target = 0.9

# ── Storage assumptions ─────────────────────────────────────────────────────
# SSD-backed volume: random reads cost nearly the same as sequential, so the
# default 4.0 (written for spinning disks) pushes the planner toward
# unnecessary sequential scans.
random_page_cost = 1.1
effective_io_concurrency = 200

# ── Logging ─────────────────────────────────────────────────────────────────
# stderr so `docker compose logs postgres` is the single place to look, and
# Docker's json-file driver handles rotation.
log_destination = 'stderr'
logging_collector = off

# Queries slower than a second. Fast enough to stay quiet in normal operation,
# slow enough that anything it catches is worth reading.
log_min_duration_statement = 1000

# Connection churn is a useful signal when a service's pool misbehaves.
log_connections = on
log_disconnections = on

# Every statement that errors, plus all DDL — so a schema change is never a
# mystery after the fact.
#
# HAZARD: `ddl` includes CREATE/ALTER ROLE ... PASSWORD, so any role management
# done in a normal session writes that password in plaintext to the container
# log. This bit us once during M4 provisioning. Scripts that set passwords MUST
# open with `SET log_statement='none'` for their session — see
# postgres/initdb/10-roles-and-databases.sh. Do not "fix" that by weakening
# this line; DDL logging is worth keeping.
log_min_error_statement = error
log_statement = 'ddl'

# Timestamp, user, database and PID. Without this, log lines from concurrent
# backends are almost impossible to attribute.
log_line_prefix = '%m [%p] %q%u@%d '

log_checkpoints = on
log_lock_waits = on

# ── Autovacuum ──────────────────────────────────────────────────────────────
# On by default and must stay on; turning it off is how a Postgres instance
# reaches transaction-ID wraparound. Slightly more aggressive than default
# because n8n's execution tables churn heavily.
autovacuum = on
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ── Locale and timezone ─────────────────────────────────────────────────────
# UTC in the database regardless of the host's TZ. Application-side display is
# the application's problem; storing local time is how DST bugs get in.
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
