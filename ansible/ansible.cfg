# Ansible configuration for life-server (ADR-0001).
# Committed so every run behaves identically regardless of local settings.
[defaults]
inventory              = inventory.ini
roles_path             = roles
host_key_checking      = True
interpreter_python     = auto_silent
display_skipped_hosts  = False
retry_files_enabled    = False
deprecation_warnings   = False
# YAML-formatted output. The community.general.yaml callback was removed in
# collection v12; this is the built-in replacement.
result_format          = yaml
callbacks_enabled      = profile_tasks

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
