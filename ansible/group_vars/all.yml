---
# Variables shared by every role. Change here, not in the roles.

# The non-root user that owns /opt/life-server and runs docker compose.
deploy_user: deploy

# Public key installed for deploy_user. Read from the operator's machine at
# runtime so the key is never committed to Git.
deploy_pubkey_path: "~/.ssh/life-server.pub"

server_hostname: life-server
server_timezone: Europe/Berlin

# 3.7 GB RAM. Swap is a safety margin against the OOM killer, not a
# performance feature — swappiness is lowered so it is only used under
# real pressure. See docs/milestones/M1.md.
swap_size_mb: 2048
swappiness: 10

# SSH stays open until Tailscale is proven in M8.5 (ADR-0013).
ssh_port: 22

# fail2ban: 5 failures in 10 min -> 1 h ban.
#
# Addresses fail2ban must never ban, space-separated. The operator's own
# address belongs here: `mode = aggressive` treats a closed connection as a
# failure, so a normal deploy can lock you out of your own server.
# Empty is valid and simply adds nothing.
fail2ban_ignore_extra: "165.1.187.194"
fail2ban_maxretry: 5
fail2ban_findtime: 10m
fail2ban_bantime: 1h

# Unattended upgrades reboot at this time if a reboot is required.
unattended_reboot_time: "04:00"

# --- Backups (M5, ADR-0009) -------------------------------------------------
# Where the repo is synced on the server. The systemd units call scripts from
# here, so it must match REMOTE_DIR in scripts/deploy.sh.
life_server_dir: /opt/life-server

# 02:30 daily — after midnight churn, well before the 04:00 unattended-upgrades
# reboot window, so a backup is never mid-flight when the host restarts.
backup_schedule: "*-*-* 02:30:00"

# Sunday 03:15: the weekly deep check. Deliberately not the same minute as the
# daily timer, so the two never contend for the repository lock.
backup_check_schedule: "Sun *-*-* 03:15:00"

# Jitter. Also stops the backup landing on exactly the same second every day.
backup_randomized_delay_sec: 300

# Timeouts. Generous for today's ~80 MB set, but bounded: a hung repository
# must fail rather than wedge the unit so the timer never fires again.
backup_timeout_sec: 3600
backup_check_timeout_sec: 7200
