# =============================================================================
# inventory.ini — which hosts the playbook manages.
# =============================================================================
#
# The IP below was verified against the Hetzner Cloud Console on 2026-07-28.
#
# ansible_user switched from root to deploy in M1, at the moment root SSH was
# disabled. Ansible escalates with `become: true`, using the passwordless sudo
# granted by the users role.
#
# If this ever becomes unreachable, the fallback is the Hetzner Cloud Console
# (VNC) with the root password — independent of SSH, Docker and the firewall.
# =============================================================================

[life]
life-server ansible_host=62.238.4.64

[life:vars]
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/life-server
ansible_python_interpreter=/usr/bin/python3
