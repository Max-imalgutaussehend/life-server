# =============================================================================
# inventory.ini — which hosts the playbook manages.
# =============================================================================
#
# The IP below was verified against the Hetzner Cloud Console on 2026-07-28.
# (The registry listing for this range does not obviously match Hetzner's
# published allocations, which is why it was checked directly rather than
# taken from the provisioning email.)
#
# ansible_user is root ONLY until M1 creates the deploy user and disables root
# login. After M1 this becomes `deploy` with become=true — see docs/milestones/M1.md.
# =============================================================================

[life]
life-server ansible_host=62.238.4.64

[life:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/life-server
ansible_python_interpreter=/usr/bin/python3
