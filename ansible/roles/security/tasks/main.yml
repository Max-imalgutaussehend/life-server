---
# security — SSH hardening, firewall, fail2ban, automatic updates.
#
# Runs ONLY after verify_access has proven the deploy user works.
# Ordering inside this role also matters: UFW is configured and enabled
# BEFORE sshd is restarted, so there is never a window with a new sshd
# config and no firewall.

# ── Firewall ────────────────────────────────────────────────────────────────

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outgoing
  # Containers need to reach the internet (image pulls, API calls, the
  # Cloudflare tunnel dialling out). Egress filtering would break the tunnel
  # model for no gain on a single-tenant host.
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Rate-limit SSH
  # `limit` not `allow`: ufw drops connections from an IP exceeding ~6
  # attempts in 30s. Cheap defence against credential stuffing, on top of
  # key-only auth. Port closes entirely in M8.5 (ADR-0013).
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp
    comment: "SSH (rate limited) - closes at M8.5"

- name: Enable ufw with logging
  community.general.ufw:
    state: enabled
    logging: low

# ── fail2ban ────────────────────────────────────────────────────────────────

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure fail2ban sshd jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  # Skipped in check mode: the unit file only exists once the package is
  # really installed.
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: not ansible_check_mode

# ── Automatic security updates ──────────────────────────────────────────────

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable periodic apt tasks
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

# ── SSH hardening — LAST, after verify_access proved deploy works ──────────

- name: Remove cloud-init SSH drop-in
  # Ubuntu's cloud-init writes /etc/ssh/sshd_config.d/50-cloud-init.conf
  # containing `PasswordAuthentication yes`. sshd uses FIRST-match-wins for
  # directives, and 50- sorts before 99-, so that file silently overrides our
  # hardening. This was caught in M1 by checking `sshd -T` rather than
  # trusting that writing the file was enough.
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart sshd

- name: Prevent cloud-init from recreating the SSH drop-in
  # Without this, a cloud-init re-run on reboot restores the file and
  # re-enables password auth.
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-ssh-pwauth.cfg
    content: |
      # Managed by ansible/roles/security.
      # Stops cloud-init rewriting sshd_config.d/50-cloud-init.conf.
      ssh_pwauth: false
    owner: root
    group: root
    mode: "0644"

- name: Harden sshd
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-life-server.conf
    owner: root
    group: root
    mode: "0644"
    # A malformed sshd config would leave the daemon unable to restart.
    # -t validates before the file is installed.
    validate: "sshd -t -f %s"
  notify: Restart sshd
  # In check mode the drop-in is not written, so `sshd -T` in post_tasks would
  # report the OLD config and the assertion would fail misleadingly.
  when: not ansible_check_mode

- name: Determine whether sshd uses socket activation
  # Ubuntu 24.04 defaults to ssh.socket: the socket owns port 22 and spawns
  # ssh.service on demand. That is workable, but every service restart opens a
  # window where connections are REFUSED rather than queued — which is exactly
  # what bit this host mid-session (`is-active: active` while
  # `is-enabled: disabled`, and SSH refusing connections).
  #
  # A server that always wants sshd listening gains nothing from socket
  # activation, so this pins the classic model: ssh.service enabled, socket off.
  ansible.builtin.command:
    cmd: systemctl is-enabled ssh.socket
  register: ssh_socket_state
  changed_when: false
  failed_when: false

- name: Stop and disable ssh.socket
  # Order matters: the socket must release port 22 before ssh.service can bind
  # it. Doing this in one step avoids a window where neither is listening.
  ansible.builtin.systemd:
    name: ssh.socket
    enabled: false
    state: stopped
  when: "'enabled' in ssh_socket_state.stdout"

- name: Enable and start ssh.service
  # `enabled: true` is the important half — without it sshd survives until the
  # next reboot and then never comes back, locking you out of a box whose only
  # other entry point is the provider console.
  ansible.builtin.systemd:
    name: ssh.service
    enabled: true
    state: started
    daemon_reload: true

- name: Verify sshd will start on boot
  # Assert rather than assume: this is the single setting whose silent failure
  # costs you the server on the next reboot.
  ansible.builtin.command:
    cmd: systemctl is-enabled ssh.service
  register: ssh_enabled_check
  changed_when: false
  failed_when: "'enabled' not in ssh_enabled_check.stdout"

- name: Flush handlers so sshd restarts before the play ends
  # Without this the restart happens at the very end; we want it here so the
  # post_tasks verification in site.yml tests the NEW config.
  ansible.builtin.meta: flush_handlers
