---
# common — hostname, timezone, base packages, swap.
# No security policy here; that is the security role.

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

- name: Ensure hostname resolves locally
  # Without this, sudo emits "unable to resolve host" warnings on every call.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ server_hostname }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  # Deliberately short. Applications belong in containers (ADR-0002);
  # this is operator tooling and what the other roles need.
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - htop
      - jq
      - python3-apt      # required by Ansible's apt module
      - rsync
      - unattended-upgrades
      - vim
    state: present

# ── Swap ────────────────────────────────────────────────────────────────────
# 3.7 GB RAM with a dev stack planned. Swap does not make the box faster; it
# buys time before the OOM killer picks a container to terminate.
#
# `check_mode: false` on the stat, and `when: not ansible_check_mode` on the
# file-manipulating tasks: in a dry run fallocate creates nothing, so the
# follow-up chmod/mkswap would fail on a file that does not exist. This keeps
# `make harden-check` clean without weakening the real run.

- name: Check whether swapfile exists
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat
  check_mode: false

- name: Create swapfile
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_mb }}M /swapfile"
    creates: /swapfile
  when: not swapfile_stat.stat.exists

- name: Secure swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode or swapfile_stat.stat.exists

- name: Format swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when:
    - not swapfile_stat.stat.exists
    - not ansible_check_mode
  register: mkswap_result
  changed_when: mkswap_result.rc == 0

- name: Enable swapfile in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile'
    line: "/swapfile none swap sw 0 0"
    state: present

- name: Activate swap
  ansible.builtin.command:
    cmd: swapon /swapfile
  when:
    - not swapfile_stat.stat.exists
    - not ansible_check_mode
  register: swapon_result
  changed_when: swapon_result.rc == 0
  failed_when:
    - swapon_result.rc != 0
    - "'already active' not in (swapon_result.stderr | default(''))"

- name: Tune swappiness
  # Default 60 swaps too eagerly for a container host. 10 means "only under
  # real memory pressure".
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swappiness }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-life-server.conf
    reload: true
