# Overrides the image's baked-in /etc/nginx/conf.d/default.conf, which
# listens on 80 — a port services.yml can't reuse (ntfy already claims it;
# the generator rejects two enabled services sharing a port number). Nothing
# else about the image needed changing, so this is the whole diff: same
# nginx, same static root, different listen port.
server {
    listen       8083;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
