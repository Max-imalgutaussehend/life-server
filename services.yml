# ============================================================================
# services.yml — THE single source of truth for externally reachable services.
# ============================================================================
#
# WHY THIS FILE EXISTS
#   Adding a service to a normal Docker host means editing the Caddyfile, the
#   Cloudflare tunnel config, the compose file, the env file, the monitoring
#   config and the docs — six places, six chances to forget one. That drift is
#   the reason "production" servers slowly stop matching their documentation.
#
#   This file is the only place a service is declared. Everything else is
#   generated from it by `make generate` (see generator/render.py).
#
# HOSTNAME DERIVATION — never hardcode a hostname anywhere.
#   prod:  <name>.<DOMAIN>              -> n8n.maxrommel.de
#   dev:   <name>.dev.<DOMAIN>          -> n8n.dev.maxrommel.de
#   DOMAIN and ENV come from .env. The generator applies the rule; no file
#   downstream ever contains a literal hostname.
#
# WHAT IS GENERATED FROM THIS FILE
#   compose/generated/caddy/Caddyfile        reverse-proxy routes
#   compose/generated/cloudflared/config.yml tunnel ingress rules
#   compose/generated/services.env           per-service hostname variables
#   docs/generated/SERVICES.md               service inventory table
#   (later milestones: uptime-kuma monitors, compose service fragments)
#
# HOW TO ADD A SERVICE
#   1. Add an entry below.
#   2. Run `make generate`.
#   3. Commit both this file and the regenerated output.
#   Nothing else. If you find yourself editing generated files by hand, the
#   generator is missing a feature — fix the generator, not the output.
#
# FIELD REFERENCE
#   name          required. DNS label + compose service name. [a-z0-9-]
#   port          required. Port the container listens on *inside* Docker.
#                 This is never published to the host (ADR-0003).
#   description   required. One line. Shown in generated docs.
#   networks      required. Which segmented networks the service joins.
#                 Valid: edge, apps, data  (ADR-0004)
#   access        required. Cloudflare Access policy (ADR-0003).
#                 "private"  -> Access-protected, only you can reach it
#                 "public"   -> reachable without Access. Use sparingly and
#                               only for things genuinely meant for the world.
#   envs          optional. Which environments it runs in. Default [prod, dev].
#   healthcheck   optional. HTTP path for liveness. Default "/".
#   enabled       optional. Default true. false = declared but not deployed;
#                 keeps the entry documented without generating routes.
#
# NOTE ON THE CURRENT STATE
#   Every service below is enabled:false because none are deployed yet (M0).
#   Each will be flipped to true in the milestone that actually deploys it.
#   They are listed now so the registry documents the target architecture.
# ============================================================================

services:
  # whoami (M3) was the vertical-slice test target and is GONE as of M11. It
  # proved Cloudflare -> tunnel -> Caddy -> container worked, which real
  # services now prove continuously just by serving traffic.
  #
  # It was also the only `access: public` entry in this file — the single
  # unauthenticated endpoint on a host that now runs agents. A request-echo is
  # harmless in isolation and unnecessary once the path is proven, so it was
  # removed rather than left as the one thing nobody was gating. See ADR-0020.

  - name: n8n
    port: 5678
    description: "Workflow automation and integration engine"
    networks: [apps, data]
    access: private
    healthcheck: /healthz
    enabled: true # M6

  # Access application created 2026-07-31, so the public route is on.
  #
  # HISTORY WORTH KEEPING: this was briefly enabled BEFORE the Access policy
  # existed, and paperclip.maxrommel.de answered 200 to an unauthenticated
  # request — a public ticket queue holding whatever the agents know about work,
  # uni and job search. Reverted within minutes. Verify gating by the redirect
  # TARGET (cloudflareaccess.com), never by the status code: Uptime Kuma proved
  # in M8 that a 302 can equally mean "the app redirected you itself".
  - name: paperclip
    port: 3100
    description: "Paperclip — the agent board (upstream, M11)"
    networks: [apps, data]
    access: private
    enabled: true # M9

  # Hermes and OpenClaw are AGENT RUNTIMES, not web apps. Paperclip calls them
  # over HTTP/SSE on the internal `agent` network; nothing outside the host ever
  # needs to reach them. They are therefore deliberately NOT declared here —
  # this registry generates PUBLIC routes, and a public route to an agent
  # runtime would expose an endpoint that executes model-chosen code.
  #
  # They are plain compose services on `agent` only. See ADR-0020.

  - name: status
    port: 3001
    description: "Uptime Kuma — service monitoring and alerting"
    networks: [apps]
    access: private
    enabled: true # M8

  # NOTE: ntfy is access: private like everything else, but its push endpoint is
  # what a phone subscribes to. Cloudflare Access gates browsers, not the ntfy
  # app — so mobile push needs either the app's Access service-token support or
  # a deliberate public topic. Decided in M8; see docs/milestones/M8.md.
  - name: ntfy
    port: 80
    description: "Push notification relay for alerts"
    networks: [apps]
    access: private
    enabled: true # M8
