# App-of-apps: Argo CD watches gitops/apps on main. Manual sync until phase 21.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Max-imalgutaussehend/life-server.git
    targetRevision: main
    path: gitops/apps
    directory: { recurse: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions: [CreateNamespace=true]
