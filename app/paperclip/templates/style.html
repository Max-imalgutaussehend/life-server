{{define "style.html"}}
<style>
/* Inline and self-contained on purpose: no CDN, no external font, no build
   step. The page must render identically whether or not anything outside this
   server is reachable — and it sits behind Cloudflare Access, so a third-party
   asset would leak that this hostname exists to whoever serves it. */
:root {
	color-scheme: light dark;
	--bg: #fbfbfa; --fg: #1a1a19; --dim: #6b6b68;
	--line: #e3e3e0; --card: #fff;
	--accent: #2b6cb0; --ok: #2f7d4f; --warn: #a16207; --bad: #b42318;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #17171a; --fg: #e8e8e6; --dim: #9a9a96;
		--line: #2c2c30; --card: #1e1e22;
		--accent: #7aa7d9; --ok: #6cc08b; --warn: #d9a441; --bad: #f2837a;
	}
}
* { box-sizing: border-box; }
body {
	margin: 0 auto; padding: 2rem 1.25rem 4rem; max-width: 60rem;
	background: var(--bg); color: var(--fg);
	font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
}
h1 { font-size: 1.4rem; margin: 0 0 .25rem; font-weight: 620; }
h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
     color: var(--dim); margin: 2rem 0 .5rem; font-weight: 600; }
header { border-bottom: 1px solid var(--line); padding-bottom: 1rem; margin-bottom: 1.25rem; }
.sub { color: var(--dim); font-size: .87rem; margin: .2rem 0; }
.dim { color: var(--dim); }
.bad { color: var(--bad); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.goal { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
.goal input {
	flex: 1; padding: .6rem .75rem; font-size: .95rem;
	border: 1px solid var(--line); border-radius: 7px;
	background: var(--card); color: var(--fg);
}
.goal input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button {
	padding: .55rem .95rem; font-size: .9rem; font-weight: 550; cursor: pointer;
	border: 1px solid var(--line); border-radius: 7px;
	background: var(--card); color: var(--fg);
}
button:hover { border-color: var(--accent); }
button.ok   { border-color: var(--ok);   color: var(--ok); }
button.warn { border-color: var(--warn); color: var(--warn); }

table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th {
	text-align: left; font-weight: 550; font-size: .72rem; text-transform: uppercase;
	letter-spacing: .05em; color: var(--dim);
	border-bottom: 1px solid var(--line); padding: .4rem .5rem;
}
td { padding: .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:hover td { background: var(--card); }
.row-review td { box-shadow: inset 2px 0 0 var(--accent); }
.row-failed td { box-shadow: inset 2px 0 0 var(--bad); }

.pill {
	display: inline-block; padding: .1rem .5rem; border-radius: 99px;
	font-size: .72rem; font-weight: 600; letter-spacing: .02em;
	border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
}
.s-review  { color: var(--accent); border-color: var(--accent); }
.s-failed  { color: var(--bad);    border-color: var(--bad); }
.s-open    { color: var(--fg); }
.s-claimed { color: var(--warn);   border-color: var(--warn); }
.s-done    { color: var(--ok);     border-color: var(--ok); }

.review-gate {
	background: var(--card); border: 1px solid var(--accent);
	border-radius: 9px; padding: 1rem 1.1rem; margin: 1.25rem 0;
}
.review-gate p { margin: 0 0 .75rem; font-size: .9rem; }
.review-gate form { display: flex; gap: .5rem; flex-wrap: wrap; }

pre {
	background: var(--card); border: 1px solid var(--line); border-radius: 7px;
	padding: .85rem; overflow-x: auto; font-size: .84rem; line-height: 1.5;
	white-space: pre-wrap; word-break: break-word; margin: 0;
	font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
.empty { color: var(--dim); font-size: .9rem; padding: 1.5rem 0; }
footer {
	margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line);
	color: var(--dim); font-size: .8rem;
}
</style>
{{end}}
